<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Appointment Form</title>
    <!-- ربط ملف التنسيق -->
    <link rel="stylesheet" href="styel.css">
</head>
<body>
<!-- صورة الدكتورة على الشمال -->
<img src="image.png" alt="Doctor">

<!-- عنوان الفورم -->
<h1>Doctor Appointment Form</h1>
<div class="form">
    <form>
       
        <!-- تاريخ الموعد -->
        <div>
            <label>Appointment Date</label>
            <input type="date">
        </div>
       
        <!-- وقت الموعد -->
        <div>
            <label>Appointment Time</label>
            <input type="time" name="time">
        </div>
        
        <!-- الاسم الأول والأخير -->
        <div>
            <label>Name</label>
            <input type="text" placeholder="First">
            <input type="text" placeholder="Last">
        </div>
       
        <!-- النوع: اختيار واحد فقط لأن name واحد -->
        <div>
            <label>Gender</label>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female" checked> Female
        </div>
       
        <!-- رقم التليفون -->
        <div>
            <label>Phone</label>
            <input type="text" name="phone" placeholder="####">
        </div>
       
        <!-- العنوان: المدينة والمحافظة -->
        <div>
            <label>Address</label>
            <input type="text" placeholder="city">
            <input type="text" placeholder="state">
        </div>
        
        <!-- رسالة المريض -->
        <div>
            <label>Your Query</label>
            <textarea></textarea>
        </div>
        
        <!-- نوع الكشف: ممكن اختيار أكتر من واحد -->
        <div class="appointment-type">
            <label>Appointment<br>Type</label>
            <span>
                Select which appointment type(s) you require
                <br>
                <input type="checkbox" name="appointment" value="cervix" checked> Cervix checkup
                <br>
                <input type="checkbox" name="appointment" value="heart" checked> Heart checkup
                <br>
                <input type="checkbox" name="appointment" value="eye"> Eye check-up
                <br>
                <input type="checkbox" name="appointment" value="hearing"> Hearing Test
                <br>
                <!-- زرار الإرسال -->
                <button>Send</button>
            </span>
        </div>
    </form>
</div>
</body>
</html>
